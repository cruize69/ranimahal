<svg viewBox="0 0 2400 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sunday buffet spread">
  <defs>
    <linearGradient id="basebandbuffetsvg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2B1806"/>
      <stop offset="100%" stop-color="#0B0908"/>
    </linearGradient>
    <radialGradient id="blob0bandbuffetsvg"><stop offset="0%" stop-color="#9A5D10" stop-opacity="1"/><stop offset="100%" stop-color="#9A5D10" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob1bandbuffetsvg"><stop offset="0%" stop-color="#F0B02E" stop-opacity="1"/><stop offset="100%" stop-color="#F0B02E" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob2bandbuffetsvg"><stop offset="0%" stop-color="#F0B02E" stop-opacity="1"/><stop offset="100%" stop-color="#F0B02E" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob3bandbuffetsvg"><stop offset="0%" stop-color="#9A5D10" stop-opacity="1"/><stop offset="100%" stop-color="#9A5D10" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob4bandbuffetsvg"><stop offset="0%" stop-color="#F0B02E" stop-opacity="1"/><stop offset="100%" stop-color="#F0B02E" stop-opacity="0"/></radialGradient>
    <radialGradient id="vigbandbuffetsvg" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <filter id="grainbandbuffetsvg" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="65" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="ng"/>
      <feComponentTransfer in="ng" result="na">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feBlend mode="overlay" in="SourceGraphic" in2="na"/>
    </filter>
  </defs>
  <g filter="url(#grainbandbuffetsvg)">
    <rect width="2400" height="1000" fill="url(#basebandbuffetsvg)"/>
    <circle cx="130" cy="352" r="1367" fill="url(#blob0bandbuffetsvg)" opacity="0.72"/>
  <circle cx="290" cy="915" r="1116" fill="url(#blob1bandbuffetsvg)" opacity="0.39"/>
  <circle cx="448" cy="219" r="1632" fill="url(#blob2bandbuffetsvg)" opacity="0.42"/>
  <circle cx="1619" cy="456" r="788" fill="url(#blob3bandbuffetsvg)" opacity="0.51"/>
  <circle cx="490" cy="2" r="1419" fill="url(#blob4bandbuffetsvg)" opacity="0.41"/>
  </g>
  <rect width="2400" height="1000" fill="url(#vigbandbuffetsvg)"/>
</svg>